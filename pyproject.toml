[project]
name = "massmap"
version = "0.1.0"
description = "Заключение о перспективах пополнения конкурсной массы: транзитные цепочки, квалификация, отчёт"
requires-python = ">=3.11"
dependencies = ["networkx>=3.0", "pydantic>=2.0"]

[project.scripts]
massmap = "massmap.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
